services:
  - type: web
    name: sodm-recrutement
    runtime: node
    plan: free
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund && npm test
    startCommand: npm start
    healthCheckPath: /api/jobs
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: HOST
        value: "0.0.0.0"
      - key: SEED_DEMO
        value: "true"
      - key: DB_PATH
        value: /tmp/sodm-recrutement.sqlite
      - key: ADMIN_PASSWORD
        sync: false
