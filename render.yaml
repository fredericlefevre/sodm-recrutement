services:
  - type: web
    name: sodm-recrutement
    runtime: node
    plan: starter
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund && npm test
    startCommand: npm start
    healthCheckPath: /api/jobs
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: HOST
        value: "0.0.0.0"
      - key: SEED_DEMO
        value: "false"
      - key: DB_PATH
        value: /var/data/recrutement.sqlite
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: recrutement-data
      mountPath: /var/data
      sizeGB: 1
